name: Train and publish cardiovascular Random Forest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-cardio-model.yml"
      - "scripts/train_cardio_rf.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardio-model-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model dependencies
        run: python -m pip install --upgrade pip pandas scikit-learn kagglehub

      - name: Train the selected Random Forest
        run: python scripts/train_cardio_rf.py

      - name: Commit the fitted model artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u src/data/
          git add -f src/data/cardiovascular-rf-metadata.json src/data/cardiovascular-rf-trees.bin.gz
          if git diff --cached --quiet; then
            echo "Model artifact is unchanged."
          else
            git commit -m "Add fitted cardiovascular Random Forest artifact [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
